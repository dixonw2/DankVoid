buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
    dependencies {
        classpath("com.anatawa12.forge:ForgeGradle:${project.property('forgeGradleVersion')}")
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'idea'
apply plugin: 'eclipse'

final String minecraftVersion = project.property('minecraftVersion')
final String modVersion = project.property('modVersion')
final String fileEncoding = 'UTF-8'
final String disableBackups = '-Dfml.doNotBackup=true'

group = project.property('modGroup')
version = "${minecraftVersion}-${modVersion}"
archivesBaseName = project.property('modArchiveName')

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

tasks.withType(JavaCompile) {
    options.encoding = fileEncoding
}

minecraft {
    version = "${minecraftVersion}-${project.property('forgeVersion')}"
    mappings = project.property('mcpMappings')
    runDir = 'run'
    useDepAts = true

    replace('@VERSION@', modVersion)
    replace('@FINGERPRINT@', project.findProperty('signSHA1') ?: '')

    clientJvmArgs += disableBackups
    clientRunArgs += "--username=${project.property('developmentUsername')}"
    serverJvmArgs += disableBackups
    serverJvmArgs += '-Dfml.queryResult=confirm'
}

apply from: 'gradle/scripts/repositories.gradle'
apply from: 'gradle/scripts/dependencies.gradle'
apply from: 'gradle/scripts/artifacts.gradle'

processResources {
    final Map<String, String> metadata = [
        version: project.version.toString(),
        mcversion: minecraftVersion
    ]
    inputs.properties(metadata)
    filteringCharset = fileEncoding
    filesMatching('mcmod.info') {
        expand(metadata)
    }
    filesMatching('*_at.cfg') {
        path = "META-INF/${name}"
    }
}

idea {
    module {
        inheritOutputDirs = false
        outputDir = project.tasks.compileJava.destinationDir
        testOutputDir = project.tasks.compileTestJava.destinationDir
    }
}

runClient.outputs.upToDateWhen { false }
runServer.outputs.upToDateWhen { false }
